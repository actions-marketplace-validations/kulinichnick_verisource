name: Verisource CI & 9.5 Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Typecheck, Unit, MCP, Build & E2E Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROVIDER_MODE: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm (from packageManager)
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all 6 workspaces (cold-clone safe)
        run: pnpm typecheck

      - name: Run @verisource/core-geo, @verisource/cli & @verisource/mcp-worker unit tests
        run: pnpm test

      - name: Build all 6 workspaces (Next.js, Worker dry-run, CLI, Chrome MV3)
        run: pnpm build

      - name: Run live Next.js E2E & >=9.5/10 Quality Gate verification
        run: pnpm --filter @verisource/web test:e2e

      - name: Package Chrome Web Store MV3 archive
        run: |
          pnpm --filter @verisource/extension zip
          mkdir -p build
          cp apps/extension/.output/*-chrome.zip build/verisource-chrome-mv3-v1.0.1.zip
          ls -lh build/verisource-chrome-mv3-v1.0.1.zip

      - name: Upload Chrome MV3 .zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: verisource-chrome-mv3-extension
          path: build/verisource-chrome-mv3-v1.0.1.zip
          include-hidden-files: true
          if-no-files-found: error
